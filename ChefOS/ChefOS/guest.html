<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Меню — ChefOS</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: #faf7f2; color: #1c1c1e; min-height: 100vh; }
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 20px 48px; }
  h1 { font-family: Georgia, 'Times New Roman', serif; font-size: 34px; text-align: center; margin-bottom: 4px; }
  .sub { text-align: center; color: #8a8a8e; font-size: 14px; margin-bottom: 28px; }
  .cat { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #f97316; margin: 28px 0 10px; border-bottom: 1px solid #eee; padding-bottom: 6px; }
  .dish { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0ede8; }
  .dish img { width: 64px; height: 64px; object-fit: cover; border-radius: 12px; flex-shrink: 0; }
  .dish .nm { flex: 1; font-size: 17px; font-weight: 600; line-height: 1.3; }
  .dish .pr { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .empty { text-align: center; color: #8a8a8e; padding: 60px 0; font-size: 16px; line-height: 1.6; }
  .foot { text-align: center; color: #b0b0b4; font-size: 12px; margin-top: 40px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Меню</h1>
  <p class="sub" id="sub">Загрузка…</p>
  <div id="menu"></div>
  <p class="foot">ChefOS</p>
</div>
<script>
(function () {
  var u = new URLSearchParams(location.search).get('u') || '';
  var box = document.getElementById('menu');
  var sub = document.getElementById('sub');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function money(n) { return 'C$' + (Number(n) || 0).toFixed(0); }
  if (!u) { sub.textContent = ''; box.innerHTML = '<p class="empty">Меню недоступно.</p>'; return; }
  fetch('/api/public-menu/' + encodeURIComponent(u))
    .then(function (r) { if (!r.ok) throw new Error('nf'); return r.json(); })
    .then(function (data) {
      sub.textContent = '@' + data.login;
      var dishes = data.dishes || [];
      if (!dishes.length) { box.innerHTML = '<p class="empty">В меню пока пусто.</p>'; return; }
      var groups = {};
      dishes.forEach(function (d) { var c = (d.category || 'Меню').trim() || 'Меню'; (groups[c] = groups[c] || []).push(d); });
      var html = '';
      Object.keys(groups).sort(function (a, b) { return a.localeCompare(b, 'ru'); }).forEach(function (c) {
        html += '<div class="cat">' + esc(c) + '</div>';
        groups[c].forEach(function (d) {
          html += '<div class="dish">' + (d.img ? '<img src="' + esc(d.img) + '" alt="">' : '') +
            '<span class="nm">' + esc(d.name) + '</span>' +
            '<span class="pr">' + (d.price > 0 ? money(d.price) : '') + '</span></div>';
        });
      });
      box.innerHTML = html;
    })
    .catch(function () { sub.textContent = ''; box.innerHTML = '<p class="empty">Меню недоступно.<br>Попросите показать его ещё раз.</p>'; });
})();
</script>
</body>
</html>
